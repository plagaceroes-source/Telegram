<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}News Agent — админка{% endblock %}</title>

  <!-- PWA: "Добавить на главный экран" -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#1c1e21">
  <link rel="icon" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="News Agent">
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #f5f6f8; color: #1c1e21; }
    header { background: #1c1e21; color: #fff; padding: 12px 24px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
    header a { color: #d0d3d9; text-decoration: none; font-size: 14px; }
    header a.active, header a:hover { color: #fff; font-weight: 600; }
    header .brand { font-weight: 700; color: #fff; margin-right: 8px; }
    main { padding: 24px; max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 22px; margin-top: 0; }
    table { border-collapse: collapse; width: 100%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #eee; font-size: 14px; }
    th { background: #fafafa; }
    form.inline { display: inline; }
    .card { background: #fff; padding: 16px 20px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.08); margin-bottom: 20px; }
    input, select, textarea { padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button { padding: 6px 14px; border: none; border-radius: 4px; background: #2f6fed; color: #fff; cursor: pointer; font-size: 14px; }
    button.secondary { background: #666; }
    button.danger { background: #d64545; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    .badge.active { background: #dcf5e0; color: #1a7a2e; }
    .badge.paused { background: #f2f2f2; color: #666; }
    .badge.limited { background: #fdecc8; color: #8a5a00; }
    .badge.pending { background: #fdecc8; color: #8a5a00; }
    .badge.approved, .badge.published { background: #dcf5e0; color: #1a7a2e; }
    .badge.rejected { background: #fde0e0; color: #a11; }
    .muted { color: #888; font-size: 13px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <span class="brand">News Agent</span>
    <a href="/sources" class="{{ 'active' if active == 'sources' }}">Источники</a>
    <a href="/accounts" class="{{ 'active' if active == 'accounts' }}">Аккаунты-слушатели</a>
    <a href="/targets" class="{{ 'active' if active == 'targets' }}">Целевые каналы сети</a>
    <a href="/queue" class="{{ 'active' if active == 'queue' }}">Очередь на утверждение</a>
    <a href="/stats" class="{{ 'active' if active == 'stats' }}">Статистика</a>
    <a href="/settings" class="{{ 'active' if active == 'settings' }}">Настройки</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
