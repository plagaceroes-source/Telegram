<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}News Agent{% endblock %}</title>

  <!-- PWA: "Добавить на главный экран" -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="News Agent">
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --card: #121212;
      --card-2: #1a1a1a;
      --border: rgba(255,255,255,0.12);
      --border-strong: rgba(255,255,255,0.30);
      --text: #ffffff;
      --muted: #9a9a9a;
      --faint: #6b6b6b;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-pill: 999px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; background: var(--bg); overscroll-behavior: none; }
    /* App-shell: body сам никогда не скроллится (и поэтому не "резинится") — вместо
       этого он занимает ровно высоту экрана и скроллится только .scroll-area внутри.
       Футер — обычный flex-элемент, а не position:fixed, поэтому WKWebView в
       standalone-режиме (запуск с "Домой") не может сдвинуть/растянуть его при
       скролле или инерции — ему просто некуда "плыть". */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .topbar {
      flex: 0 0 auto; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .topbar .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
    .topbar .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; }
    .topbar a.icon-btn {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: var(--radius-pill);
      border: 1px solid var(--border); color: var(--text); text-decoration: none;
    }

    .scroll-area { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    main { padding: 18px 16px 32px; max-width: 640px; margin: 0 auto; }
    h1 { font-size: 22px; font-weight: 700; margin: 4px 0 16px; letter-spacing: -0.01em; }
    h3 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
    }
    .stat-card .label { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
    .stat-card .value { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
    .stat-card .value .unit { font-size: 15px; color: var(--muted); font-weight: 500; margin-left: 2px; }
    .stat-card.wide { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; }
    .stat-card .sub { color: var(--faint); font-size: 12px; margin-top: 4px; }

    table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; }
    tr:last-child td { border-bottom: none; }
    .table-wrap { overflow-x: auto; margin: -4px -4px 0; }

    form.inline { display: inline; }
    label { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 5px; }
    label:first-child { margin-top: 0; }
    input, select, textarea {
      width: 100%; padding: 10px 12px; border-radius: var(--radius-md);
      border: 1px solid var(--border); background: var(--card-2); color: var(--text);
      font-size: 14px; font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--border-strong); }

    button, .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 18px; border-radius: var(--radius-pill); border: 1px solid transparent;
      font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: inherit;
      background: #fff; color: #000; text-decoration: none;
    }
    button.secondary, .btn.secondary { background: transparent; color: var(--text); border-color: var(--border-strong); }
    button.danger, .btn.danger { background: transparent; color: var(--text); border: 1px solid var(--border-strong); opacity: 0.75; }
    .form-actions { margin-top: 14px; }

    .badge {
      display: inline-flex; align-items: center; padding: 3px 10px; border-radius: var(--radius-pill);
      font-size: 11.5px; font-weight: 600; border: 1px solid var(--border-strong);
    }
    .badge.on { background: #fff; color: #000; border-color: #fff; }
    .badge.off { color: var(--faint); border-color: var(--border); }
    .badge.warn { color: var(--text); border-style: dashed; }

    .muted { color: var(--muted); font-size: 13px; }
    .faint { color: var(--faint); }

    .bottomnav {
      flex: 0 0 auto; z-index: 30;
      display: flex; gap: 4px; overflow-x: auto;
      background: rgba(0,0,0,0.92); backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
      scrollbar-width: none;
    }
    .bottomnav::-webkit-scrollbar { display: none; }
    .bottomnav a {
      flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 6px 12px; text-decoration: none; color: var(--faint); min-width: 62px;
    }
    .bottomnav a svg { width: 22px; height: 22px; stroke: currentColor; }
    .bottomnav a span { font-size: 10.5px; font-weight: 500; }
    .bottomnav a.active { color: #fff; }

    .subtabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
    .subtabs::-webkit-scrollbar { display: none; }
    .subtab-btn {
      flex: 0 0 auto; padding: 8px 16px; border-radius: var(--radius-pill);
      border: 1px solid var(--border-strong); background: transparent; color: var(--muted);
      font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .subtab-btn.active { background: #fff; color: #000; border-color: #fff; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 480px) { .grid-2 { grid-template-columns: 1fr; } }

    .list-item { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 13px 14px; margin-bottom: 10px; }
    .list-item .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .list-item .title { font-weight: 600; font-size: 14.5px; }
    .list-item .meta { color: var(--muted); font-size: 12.5px; margin-top: 5px; line-height: 1.5; }
    .list-item .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .list-item .actions form { display: contents; }
    .list-item .actions button { padding: 6px 14px; font-size: 12.5px; }
    .empty-state { text-align: center; color: var(--faint); padding: 32px 16px; font-size: 13.5px; }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="brand"><span class="dot"></span> News Agent</span>
    <a href="/settings" class="icon-btn" aria-label="Настройки">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </a>
  </div>

  <div class="scroll-area">
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>

  <nav class="bottomnav">
    <a href="/" class="{{ 'active' if active == 'dashboard' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      <span>Дашборд</span>
    </a>
    <a href="/network" class="{{ 'active' if active in ('sources', 'accounts', 'targets') }}">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7l3 9M16 7l-3 9M8.3 5.3h7.4"/></svg>
      <span>Сеть</span>
    </a>
    <a href="/queue" class="{{ 'active' if active == 'queue' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span>Очередь</span>
    </a>
    <a href="/stats" class="{{ 'active' if active == 'stats' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>
      <span>Статистика</span>
    </a>
    <a href="/settings" class="{{ 'active' if active == 'settings' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span>Настройки</span>
    </a>
  </nav>
</body>
</html>
