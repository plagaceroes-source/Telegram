databases:
  - name: news-agent-db
    plan: starter
    databaseName: news_agent
    user: news_agent

services:
  # Веб-админка (ТЗ 2.5)
  - type: web
    name: news-agent-admin
    plan: starter
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_admin.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: news-agent-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: APPROVER_CHAT_IDS
        sync: false
      - key: ADMIN_SECRET_KEY
        generateValue: true

  # Approval + publisher бот (long polling; вебхук можно включить позже)
  - type: worker
    name: news-agent-bot
    plan: starter
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_bot.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: news-agent-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: APPROVER_CHAT_IDS
        sync: false
    disk:
      name: news-agent-media
      mountPath: /opt/render/project/src/storage
      sizeGB: 5

  # Processing core (перевод/рерайт через Claude)
  - type: worker
    name: news-agent-processing
    plan: starter
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_processing.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: news-agent-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false

  # Userbot — один Background Worker НА КАЖДЫЙ Telethon-аккаунт (ТЗ 2.1, раздел 8).
  # Продублируйте этот сервис (news-agent-userbot-2, -3, ...) при добавлении новых аккаунтов,
  # каждый со своим USERBOT_ACCOUNT_ID и общим диском news-agent-sessions.
  - type: worker
    name: news-agent-userbot-1
    plan: starter
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_userbot.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: news-agent-db
          property: connectionString
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: USERBOT_ACCOUNT_ID
        value: "1"
    disk:
      name: news-agent-sessions
      mountPath: /opt/render/project/src/storage
      sizeGB: 1

  # Снепшоты статистики подписчиков (ТЗ 3.2) — Render Cron Job
  - type: cron
    name: news-agent-stats-snapshot
    plan: starter
    runtime: python
    schedule: "0 * * * *" # раз в час
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_stats_snapshot.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: news-agent-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
