<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Мы из Бланки — слово на продажу{% endblock %}</title>
<meta name="description" content="Одно слово на главной. Хочешь своё — перебей ставку. Реклама для местных бизнесов Коста-Бланки.">
<meta property="og:title" content="Мы из Бланки — слово на продажу">
<meta property="og:description" content="Одно слово. Одна ссылка. Каждая покупка в два раза дороже предыдущей.">
<meta property="og:image" content="{{ cfg.SITE_URL }}/static/img/og.jpg">
<link rel="icon" href="/static/img/mascot.jpg">
<link rel="preload" href="/static/fonts/inter-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header">
  <a class="logo" href="/">Мы из<br>Бланки<sup>®</sup></a>
  <a class="replace-button" id="open" href="/?buy=1">
    <svg viewBox="0 0 24 30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M14 2 3 17h8l-2 11 12-16h-8z"/></svg>
    <span>Заменить слово за <b id="price">{{ st.next_price|price }}</b>&nbsp;€</span>
    <svg viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h25M18 3l9 9-9 9"/></svg>
  </a>
  <div class="online" title="Сейчас на сайте"><i></i><b id="online">1</b> онлайн</div>
  <nav>
    <a href="/about" {% if page=='about' %}class="on"{% endif %}>О проекте</a>
    <a href="/rules" {% if page=='rules' %}class="on"{% endif %}>Правила</a>
    <a href="/history" {% if page=='history' %}class="on"{% endif %}>История</a>
  </nav>
</header>
<main>{% block main %}{% endblock %}</main>
<footer>
  <div>
    <a href="{{ cfg.CHANNEL_URL }}" target="_blank" rel="noopener">Telegram-канал</a>
    <a href="/offer">Оферта</a><a href="/privacy">Политика</a><a href="/about">Контакты</a>
  </div>
  <div>© Мы из Бланки. Чайка одобряет, но ответственности не несёт.</div>
</footer>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
